<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helpdesk Intake Portal</title>
  <link rel="stylesheet" href="intake-style.css">
</head>
<body>

  <div class="intake-container">
    <header>
      <h1 id="portal-title">Helpdesk Portal</h1>
      <div>Submit a New Request</div>
    </header>

    <div id="success-msg" style="display:none; color: var(--success-color); padding: 15px; margin-bottom: 25px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 12px; text-align: center;">
      <strong id="success-ticket-id"></strong> submitted successfully!
    </div>

    <form id="intake-form">
      <div id="dynamic-form-container">
        <!-- Fields will be injected here via intake.js -->
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">
        Submit Request
      </button>
    </form>


  </div>

  <script type="module" src="intake.js"></script>
</body>
</html>
